[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-ecosystem"
version = "5.1.0"
description = "A terminal-observable spatial predator-prey ecosystem"
requires-python = ">=3.11"

[project.scripts]
ecosystem = "ecosystem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
